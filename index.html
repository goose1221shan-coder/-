<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幣安合約 3小時內 5分鐘極速漲跌榜</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        binance: {
                            gold: '#F0B90B',
                            green: '#0ECB81',
                            red: '#F6465D',
                            darkBg: '#181A20',
                            cardBg: '#1E2329',
                            border: '#2B313A',
                            hover: '#2B313A'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-tag-green {
            background-color: rgba(14, 203, 129, 0.2);
            color: #0ECB81;
            border: 1px solid #0ECB81;
            box-shadow: 0 0 10px rgba(14, 203, 129, 0.6);
            animation: pulse-glow-green 1.5s infinite alternate;
        }
        .glow-tag-red {
            background-color: rgba(246, 70, 93, 0.2);
            color: #F6465D;
            border: 1px solid #F6465D;
            box-shadow: 0 0 10px rgba(246, 70, 93, 0.6);
            animation: pulse-glow-red 1.5s infinite alternate;
        }
        @keyframes pulse-glow-green {
            0% { box-shadow: 0 0 4px rgba(14, 203, 129, 0.4); }
            100% { box-shadow: 0 0 12px rgba(14, 203, 129, 0.9); }
        }
        @keyframes pulse-glow-red {
            0% { box-shadow: 0 0 4px rgba(246, 70, 93, 0.4); }
            100% { box-shadow: 0 0 12px rgba(246, 70, 93, 0.9); }
        }
    </style>
</head>
<body class="bg-binance-darkBg text-gray-100 min-h-screen font-sans antialiased">

    <!-- Header -->
    <header class="border-b border-binance-border bg-binance-cardBg sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-binance-gold text-black p-2 rounded-lg font-bold flex items-center justify-center">
                    <i data-lucide="flame" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
                        幣安合約 3h 內 5m 漲跌榜
                        <span class="text-xs bg-binance-gold/20 text-binance-gold px-2 py-0.5 rounded font-mono">Futures USDT-M</span>
                    </h1>
                    <p class="text-xs text-gray-400">檢視過去 3 小時內（36根5m K棒），單根 5 分鐘最大爆發 / 急殺極值</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center flex-wrap gap-3">
                <div class="flex items-center bg-binance-darkBg border border-binance-border rounded-lg px-2.5 py-1.5 text-xs text-gray-300">
                    <i data-lucide="filter" class="w-3.5 h-3.5 mr-1.5 text-gray-400"></i>
                    <span class="mr-1">最小24h量:</span>
                    <select id="min-volume" class="bg-transparent text-white font-mono focus:outline-none cursor-pointer">
                        <option value="5000000" class="bg-binance-cardBg">500萬 USDT</option>
                        <option value="10000000" selected class="bg-binance-cardBg">1000萬 USDT</option>
                        <option value="50000000" class="bg-binance-cardBg">5000萬 USDT</option>
                    </select>
                </div>

                <div class="flex items-center bg-binance-darkBg border border-binance-border rounded-lg px-2.5 py-1.5 text-xs text-gray-300">
                    <i data-lucide="timer" class="w-3.5 h-3.5 mr-1.5 text-gray-400"></i>
                    <span class="mr-1">自動刷新:</span>
                    <select id="refresh-rate" class="bg-transparent text-white font-mono focus:outline-none cursor-pointer">
                        <option value="15000" selected class="bg-binance-cardBg">15秒</option>
                        <option value="30000" class="bg-binance-cardBg">30秒</option>
                        <option value="60000" class="bg-binance-cardBg">60秒</option>
                    </select>
                </div>

                <button id="manual-refresh-btn" class="bg-binance-gold hover:bg-yellow-500 text-black font-semibold text-xs px-3 py-1.5 rounded-lg flex items-center transition shadow">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5 mr-1" id="refresh-icon"></i>
                    <span>立即刷新</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Status & Stats Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-binance-cardBg border border-binance-border rounded-xl p-4 flex items-center justify-between shadow">
                <div>
                    <div class="text-xs text-gray-400 mb-1">活躍 USDT 永續合約</div>
                    <div class="text-xl font-bold font-mono text-white" id="stat-active-symbols">載入中...</div>
                </div>
                <div class="p-3 bg-binance-darkBg rounded-lg text-binance-gold">
                    <i data-lucide="layers" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-binance-cardBg border border-binance-border rounded-xl p-4 flex items-center justify-between shadow">
                <div>
                    <div class="text-xs text-gray-400 mb-1">掃描進度</div>
                    <div class="text-xl font-bold font-mono text-blue-400" id="stat-progress">準備中</div>
                </div>
                <div class="p-3 bg-binance-darkBg rounded-lg text-blue-400">
                    <i data-lucide="activity" class="w-6 h-6 animate-pulse"></i>
                </div>
            </div>

            <div class="bg-binance-cardBg border border-binance-border rounded-xl p-4 flex items-center justify-between shadow">
                <div>
                    <div class="text-xs text-gray-400 mb-1">上次更新時間</div>
                    <div class="text-base font-bold font-mono text-
