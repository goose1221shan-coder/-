<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幣安合約漲跌幅榜</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b2430;--mute:#6b7685;--line:#e3e7ec;--up:#0f9d6b;--down:#d6334a;--warn:#c27a00;--accent:#1b2430;color-scheme:light}
:root[data-theme="dark"]{--bg:#10151c;--panel:#171e27;--ink:#e6ebf1;--mute:#8a96a6;--line:#262f3b;--up:#2fd08f;--down:#ff5c70;--warn:#f0b64a;--accent:#e6ebf1;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--panel:#171e27;--ink:#e6ebf1;--mute:#8a96a6;--line:#262f3b;--up:#2fd08f;--down:#ff5c70;--warn:#f0b64a;--accent:#e6ebf1;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:12px}
.group{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.group button{border:0;background:none;color:var(--mute);padding:7px 13px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.group button:last-child{border-right:0}
.group button.on{background:var(--accent);color:var(--bg);font-weight:600}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--up);outline-offset:2px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:14px}
.chip input[type=number]{width:56px;font:inherit;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);padding:2px 6px}
.chip button{border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;padding:0}
.status{margin-left:auto;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:1300px){.grid{grid-template-columns:1fr 1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.up h2{color:var(--up)}.down h2{color:var(--down)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:500;font-size:12px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child{color:var(--mute);width:28px;padding-right:0}
tr:last-child td{border-bottom:0}
td a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px dashed var(--mute)}
td a:hover{color:var(--up)}
.u{color:var(--up)}.d{color:var(--down)}.w{color:var(--warn);font-weight:600}
.chg{font-weight:600}
td small{display:block;color:var(--mute);font-size:11px;line-height:1.2}
.new{background:#1b2430;color:#ffe100;border:1px solid rgba(255,225,0,.5);text-shadow:0 0 6px rgba(255,225,0,.8);font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px}
.price{color:var(--up);font-weight:700}
.pct{font-size:13px;font-weight:400;color:var(--mute)}
.pct input{width:60px;font:inherit;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);padding:2px 6px}
.dist{font-weight:600}
.act{width:64px}
.act button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;padding:2px 5px}
.act button:hover{color:var(--ink)}
.act .on{color:var(--warn)}
.empty,.err{padding:20px 14px;color:var(--mute)}
.err{color:var(--down);margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#alerts{margin:0 0 4px;padding:0;list-style:none;font-size:13px}
#alerts li{padding:5px 12px;margin-bottom:4px;border-left:3px solid var(--warn);background:var(--panel);border-radius:0 6px 6px 0}
#alerts a{color:var(--ink);font-weight:600}
#hiddenBox{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
#hiddenBox button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit;font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
#volPanel h2{color:var(--warn)}
.tall{max-height:560px;overflow-y:auto}
.tall th{position:sticky;top:0;background:var(--panel);z-index:1}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
@media(max-width:1100px){.zones{grid-template-columns:1fr}}
.zone th,.zone td{padding:7px 8px}
.zone .tall{max-height:420px}
#z2 h2{color:var(--warn)}
.zc{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.zc .chip{padding:4px 10px;font-size:13px}
.log{list-style:none;margin:0;padding:0;font-size:12px}
.log:empty{display:none}
.log li{padding:5px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--warn);background:var(--bg)}
.log a{color:var(--ink);font-weight:600}
.zc input[type=text]{font:inherit;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);padding:3px 8px}
.zc .chip button{color:var(--mute);padding:0 2px}
.note{margin-top:18px;color:var(--mute);font-size:12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>幣安 U 本位合約｜漲跌幅榜</h1><button class="tbtn" id="theme" aria-label="切換日間／夜間模式"></button></div>
  <p class="sub">統計近 4 小時內的 K 線，點代號直接開啟合約交易介面。</p>

  <div class="bar">
    <div class="group" id="vol" role="group" aria-label="12 小時成交額">
      <button data-v="30000000">12h 成交額 ≥ 3000萬</button>
      <button data-v="50000000">≥ 5000萬</button>
      <button data-v="100000000">≥ 1億</button>
    </div>
    <div class="group" id="iv" role="group" aria-label="K 線週期">
      <button data-v="5m">5分</button>
      <button data-v="15m">15分</button>
      <button data-v="30m">30分</button>
      <button data-v="1h">1小時</button>
    </div>
    <div class="group" id="mode" role="group" aria-label="排序方式">
      <button data-v="max">4h 內最大單根</button>
      <button data-v="last">最新一根</button>
    </div>
  </div>
  <div class="bar">
    <label class="chip">提醒區 24h 成交額 ≥ <input type="number" id="avol" min="0" step="500"> 萬 USDT</label>
    <label class="chip">高低點區間 <input type="number" id="days" min="1" max="365" step="1"> 日</label>
    <label class="chip">高低點榜單 24h 成交額 ≥ <input type="number" id="evol" min="0" step="1000"> 萬 USDT</label>
    <label class="chip">高低點榜單 市值 <input type="number" id="capMin" min="0" step="100"> – <input type="number" id="capMax" min="0" step="100"> 萬美元</label>
    <div class="chip"><button id="hidBtn">已隱藏 0 個</button></div>
    <div class="status" id="status">載入中…</div>
  </div>

  <div id="error"></div>
  <div id="hiddenBox" hidden></div>

  <section class="panel" id="pinPanel" hidden style="margin-top:16px"><h2>★ 自選（顯示最新一根）</h2><div class="scroll" id="pins"></div></section>

  <div class="zones">
    <section class="panel zone" id="z1">
      <h2 id="z1T"></h2>
      <div class="zc"><label class="chip"><input type="checkbox" id="notify"> 提醒 5 分 K 漲跌幅 ≥ <input type="number" id="thr" min="0.5" step="0.5"> %</label></div>
      <ul class="log" id="log1"></ul>
      <div class="scroll tall" id="z1B"></div>
    </section>
    <section class="panel zone" id="z2">
      <h2 id="z2T"></h2>
      <div class="zc">
        <label class="chip"><input type="checkbox" id="vnotify"> 提醒 成交額 ≥ <input type="number" id="vthr" min="10" step="100"> 萬 USDT</label>
        <div class="group" id="vtf" role="group" aria-label="成交額 K 線週期">
          <button data-v="5m">5分</button><button data-v="15m">15分</button><button data-v="30m">30分</button><button data-v="1h">1小時</button>
        </div>
        <label class="chip">排除市值超過 <input type="number" id="mcap" min="0" step="10"> 億美元</label>
        <label class="chip"><input type="checkbox" id="cryptoOnly"> 隱藏股票代幣、黃金白銀</label>
        <label class="chip">隱藏代號 <input type="text" id="vhide" size="26" placeholder="BTC,ETH,SOL"></label>
      </div>
      <ul class="log" id="log2"></ul>
      <div class="scroll tall" id="z2B"></div>
    </section>
    <section class="panel zone" id="z3">
      <h2 id="z3T"></h2>
      <div class="zc">
        <label class="chip"><input type="checkbox" id="dnotify"> 提醒</label>
        <div class="group" id="dtf" role="group" aria-label="背離提醒週期">
          <button data-v="5m">5分</button><button data-v="15m">15分</button><button data-v="4h">4小時</button><button data-v="1d">1日</button>
        </div>
      </div>
      <ul class="log" id="log3"></ul>
      <div class="scroll tall" id="z3B"></div>
    </section>
  </div>

  <div class="grid">
    <section class="panel zone" id="z4">
      <h2 id="z4T"></h2>
      <div class="zc">
        <div class="group" id="otf" role="group" aria-label="背離總覽週期">
          <button data-v="5m">5分</button><button data-v="15m">15分</button><button data-v="4h">4小時</button><button data-v="1d">1日</button>
        </div>
      </div>
      <div class="scroll tall" id="z4B"></div>
    </section>
    <section class="panel zone" id="z5">
      <h2 id="z5T">自選追蹤：MACD／成交量／RSI 背離</h2>
      <div class="zc">
        <input type="text" id="tadd" size="18" placeholder="輸入幣種，如 DOGE、PEPE">
        <button class="tbtn" id="tbtn">加入</button>
        <label class="chip"><input type="checkbox" id="tnotify"> 提醒</label>
        <div class="group" id="ttf" role="group" aria-label="追蹤週期（可多選）">
          <button data-v="5m">5分</button><button data-v="15m">15分</button><button data-v="4h">4小時</button><button data-v="1d">1日</button>
        </div>
      </div>
      <div class="zc" id="tchips"></div>
      <ul class="log" id="log5"></ul>
      <div class="scroll tall" id="z5B"></div>
    </section>
  </div>

  <div class="grid">
    <section class="panel up"><h2 id="gT"></h2><div class="scroll" id="gainers"></div></section>
    <section class="panel down"><h2 id="lT"></h2><div class="scroll" id="losers"></div></section>
  </div>

  <div class="grid">
    <section class="panel down"><h2><span id="loT"></span><label class="pct">距離低點 ≤ <input type="number" id="loPct" min="0.1" step="0.5"> %</label></h2><div class="scroll tall" id="lows"></div></section>
    <section class="panel up"><h2><span id="hiT"></span><label class="pct">距離高點 ≤ <input type="number" id="hiPct" min="0.1" step="0.5"> %</label></h2><div class="scroll tall" id="highs"></div></section>
  </div>

  <p class="note">
    <b>資金費率</b>：正值代表多頭付費給空頭，數值偏高（≥0.05% 以橘色標示）常見於多頭擁擠，追多風險較高。<br>
    <b>新</b>：10 分鐘內剛進入榜單的合約。<br>
    <b>背離總覽與提醒</b>：修正過後，背離掃描每 60 秒會自動強制檢查並刷新，不再被長週期 K 線卡住。
  </p>
</div>

<script>
const API = "https://fapi.binance.com";
const IV = {"5m":5,"15m":15,"30m":30,"1h":60};
const IVL = {"5m":"5 分鐘","15m":"15 分鐘","30m":"30 分鐘","1h":"1 小時"};
const PRE = 30e6; 
const def = {minVol:30e6, mode:"max", iv:"5m", thr:5, avol:1000, dtf:"5m", dnotify:false, vtf:"15m", vhide:"BTC,ETH,SOL,BNB,XRP,XAU,XAG", cryptoOnly:true, otf:"5m", track:[], ttf:["5m"], tnotify:false, days:30, evol:1000, capMin:500, capMax:1500, ver:4, vthr:1000, mcap:100, vnotify:false, theme:"auto", lowPct:10, highPct:10, notify:false, pins:[], hidden:[]};
let S = {...def};
try{ Object.assign(S, JSON.parse(localStorage.getItem("bm2")||"{}")); }catch(e){}
if((S.ver || 0) < 2){ S.evol = 1000; S.capMin = 500; S.capMax = 1500; }
if((S.ver || 0) < 3){ S.thr = 5; S.avol = 1000; S.dtf = "5m"; }
if((S.ver || 0) < 4){ S.vtf = "15m"; S.vhide = def.vhide; S.cryptoOnly = true; S.otf = "5m"; S.ver = 4; }
const save = () => { try{ localStorage.setItem("bm2", JSON.stringify(S)); }catch(e){} };

let rows = [], busy = false, again = false, armed = false, seen = {}, ctx = null;
const alerted = new Set(), log = [];
const $ = id => document.getElementById(id);
const win = () => 240 / IV[S.iv];
const fmtVol = v => v >= 1e8 ? (v/1e8).toFixed(2)+" 億" : (v/1e4).toFixed(0)+" 萬";
const fmtPrice = p => { const n = +p; return n >= 100 ? n.toFixed(2) : n >= 1 ? n.toFixed(4) : n >= 0.01 ? n.toFixed(5) : n.toPrecision(4); };
const fmtTime = t => new Date(t).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
const sgn = n => (n > 0 ? "+" : "") + n.toFixed(2) + "%";
const link = s => `https://www.binance.com/zh-TC/futures/${s}`;

async function getJSON(path){
  const r = await fetch(API + path);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

const TRADFI = new Set("XAU XAG XPT XPD XCU TSLA AAPL AMZN GOOGL GOOG MSFT NVDA COIN MSTR HOOD CRCL PLTR AMD INTC NFLX BABA TSM ORCL QQQ SPY IWM MCD DIS JPM BAC".split(" "));
const meta = {};
async function loadMeta(){
  try{ const d = await getJSON("/fapi/v1/exchangeInfo"); d.symbols.forEach(x => { meta[x.symbol] = [x.underlyingType, ...(x.underlyingSubType || [])].join(","); }); }catch(e){}
}
const metaReady = loadMeta();
const isCrypto = sym => {
  if(!S.cryptoOnly) return true;
  if(TRADFI.has(sym.replace(/USDT$/, ""))) return false;
  return !/equit|stock|commodit|forex|tradfi|metal|etf/i.test(meta[sym] || "");
};

async function load(){
  if(busy){ again = true; return; }
  busy = true;
  $("status").textContent = "更新中…";
  const iv = S.iv, limit = 720 / IV[iv], w = win();
  try{
    await Promise.race([metaReady, sleep(4000)]);
    const [tickersAll, prem] = await Promise.all([getJSON("/fapi/v1/ticker/24hr"), getJSON("/fapi/v1/premiumIndex")]);
    const tickers = tickersAll;
    const fund = {}; prem.forEach(p => fund[p.symbol] = +p.lastFundingRate);
    univ = tickers.filter(t => /USDT$/.test(t.symbol) && !t.symbol.includes("_") && +t.quoteVolume > 0).map(t => ({s:t.symbol, price:t.lastPrice, fund:fund[t.symbol], v24:+t.quoteVolume}));
    const pinned = new Set(S.pins);
    const cands = tickers.filter(t => /USDT$/.test(t.symbol) && !t.symbol.includes("_") && (+t.quoteVolume >= PRE || pinned.has(t.symbol))).map(t => t.symbol);
    const volP = scanFast().catch(() => {});
    const out = []; let i = 0;
    async function worker(){
      while(i < cands.length){
        const s = cands[i++];
        try{
          const k = await getJSON(`/fapi/v1/klines?symbol=${s}&interval=${iv}&limit=${limit}`);
          const cs = k.map(x => ({t:x[0], pct:(x[4]/x[1]-1)*100}));
          const vol12 = k.reduce((a,x) => a + +x[7], 0);
          const ww = cs.slice(-w);
          let up = ww[0], dn = ww[0];
          for(const c of ww){ if(c.pct > up.pct) up = c; if(c.pct < dn.pct) dn = c; }
          const first = k[Math.max(0, k.length - w)];
          out.push({s, vol12, price:k[k.length-1][4], up, dn, last:ww[ww.length-1], recent:cs.slice(-2),
                    win:(k[k.length-1][4]/first[1]-1)*100, fund:fund[s]});
        }catch(e){}
      }
    }
    await Promise.all([...Array.from({length:8}, worker), volP]);
    if(iv !== S.iv){ busy = false; return load(); }
    rows = out;
    $("error").innerHTML = "";
    render();
    ensureDiv();
    scanTrack().catch(() => {});
    $("status").textContent = "更新於 " + new Date().toLocaleTimeString("zh-TW",{hour12:false});
  }catch(e){
    $("error").innerHTML = `<div class="err">無法連線到幣安 API（${e.message}）。請確認網路能連到 fapi.binance.com，且是用本機開啟這個 HTML 檔，而不是在聊天視窗內預覽。</div>`;
    $("status").textContent = "更新失敗";
  }
  busy = false;
  if(again){ again = false; load(); }
}

/* ---------- 提醒 ---------- */
function beep(){
  try{
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = .15;
    o.start(); o.stop(ctx.currentTime + .25);
  }catch(e){}
}
const zlog = {1:[], 2:[], 3:[]};
function pushLog(z, html){ zlog[z].unshift(html); $("log" + z).innerHTML = zlog[z].slice(0,5).join(""); }
function osNotify(title, txt){
  beep();
  try{ if("Notification" in window && Notification.permission === "granted") new Notification(title, {body:txt}); }catch(e){}
}
const base = s => s.replace("USDT", "");
const aLink = s => `<a href="${link(s)}" target="_blank" rel="noopener">${s}</a>`;
const nameCell = s => `<td><a href="${link(s)}" target="_blank" rel="noopener">${base(s)}<span style="color:var(--mute);font-weight:400">/USDT</span></a></td>`;
const actBtns = s => { const on = S.pins.includes(s); return `<button data-act="pin" data-s="${s}" class="${on?'on':''}" title="自選" aria-label="自選">${on?'★':'☆'}</button><button data-act="hide" data-s="${s}" title="隱藏" aria-label="隱藏">✕</button>`; };
function zoneTable(list, heads, rowFn, empty){
  if(!list.length) return `<div class="empty">${empty}</div>`;
  return `<table><thead><tr><th></th>${heads.map(h => `<th>${h}</th>`).join("")}<th></th></tr></thead><tbody>${list.map((x, n) => `<tr><td>${n+1}</td>${rowFn(x)}<td class="act">${actBtns(x.s)}</td></tr>`).join("")}</tbody></table>`;
}
const fmtT = (t, tf) => (tf === "4h" || tf === "1d") ? new Date(t).toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}) : fmtTime(t);

/* ---------- 30 日高低點 ---------- */
const ext = {}, extPending = new Set();
let univ = [], extPause = 0, extDone = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ek = s => s + "|" + S.days;
function extSpec(d){ return d <= 60 ? {iv:"4h", limit:d*6} : {iv:"1d", limit:d}; }
async function fillExt(syms){
  const days = S.days, sp = extSpec(days);
  const need = syms.filter(s => { const k = s + "|" + days, e = ext[k]; return (!e || Date.now() - e.at > (e.bad ? 120000 : 1800000)) && !extPending.has(k); });
  if(!need.length) return;
  need.forEach(s => extPending.add(s + "|" + days));
  let i = 0;
  async function wk(){
    while(i < need.length){
      const s = need[i++], key = s + "|" + days;
      if(Date.now() < extPause) await sleep(extPause - Date.now());
      try{
        const k = await getJSON(`/fapi/v1/klines?symbol=${s}&interval=${sp.iv}&limit=${sp.limit}`);
        ext[key] = {at:Date.now(), n:k.length, exp:sp.limit, hi:Math.max(...k.map(x => +x[2])), lo:Math.min(...k.map(x => +x[3]))};
      }catch(e){
        ext[key] = {at:Date.now(), bad:true};
        if(/429|418/.test(e.message)) extPause = Date.now() + 60000;
      }
      extPending.delete(key);
      if(++extDone % 40 === 0) renderExt();
      await sleep(300);
    }
  }

const TF = {"5m":{ms:300000, l:"5 分"}, "15m":{ms:900000, l:"15 分"}, "4h":{ms:14400000, l:"4 小時"}, "1d":{ms:86400000, l:"1 日"}};
const divCache = {};

function ema(a, n){ const k = 2/(n+1); let e = a[0]; return a.map((v, i) => i ? (e = v*k + e*(1-k)) : e); }
function rsiOf(cl, n){
  const out = Array(cl.length).fill(50); let g = 0, l = 0;
  for(let i = 1; i <= n; i++){ const d = cl[i] - cl[i-1]; g += Math.max(d, 0); l += Math.max(-d, 0); }
  g /= n; l /= n; out[n] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  for(let i = n + 1; i < cl.length; i++){
    const d = cl[i] - cl[i-1];
    g = (g*(n-1) + Math.max(d, 0))/n; l = (l*(n-1) + Math.max(-d, 0))/n;
    out[i] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  }
  return out;
}
function pivots(a, L, R, top){
  const res = [];
  for(let i = L; i < a.length - R; i++){
    let ok = true;
    for(let j = i - L; j <= i + R; j++){ if(j !== i && (top ? a[j] > a[i] : a[j] < a[i])){ ok = false; break; } }
    if(ok) res.push(i);
  }
  return res;
}
function detectDiv(k){
  const n = k.length, out = [];
  if(n < 60) return out;
  const hi = k.map(x => +x[2]), lo = k.map(x => +x[3]), cl = k.map(x => +x[4]), qv = k.map(x => +x[7]);
  const e12 = ema(cl, 12), e26 = ema(cl, 26), dif = cl.map((_, i) => e12[i] - e26[i]), rsi = rsiOf(cl, 14);
  const v3 = i => qv[i-1] + qv[i] + qv[i+1];
  for(const top of [true, false]){
    const a = top ? hi : lo, pv = pivots(a, 4, 2, top);
    if(pv.length < 2) continue;
    const p2 = pv[pv.length-1];
    if(p2 < n - 1 - 24) continue; // 【修改】從 12 擴大至 24 根，保留更多最新發生的背離
    let p1 = -1;
    for(let i = pv.length - 2; i >= 0; i--){ const d = p2 - pv[i]; if(d >= 5 && d <= 60){ p1 = pv[i]; break; } }
    if(p1 < 0) continue;
    if(top ? !(a[p2] > a[p1]) : !(a[p2] < a[p1])) continue;
    const macd = top ? (dif[p1] > 0 && dif[p2] < dif[p1]*0.9) : (dif[p1] < 0 && dif[p2] > dif[p1]*0.9);
    const vol = v3(p2) < v3(p1)*0.7;
    const rsiD = top ? (rsi[p1] > 55 && rsi[p2] < rsi[p1] - 2) : (rsi[p1] < 45 && rsi[p2] > rsi[p1] + 2);
    if(macd || vol || rsiD) out.push({top, t:k[p2][0], macd, vol, rsi:rsiD});
  }
  return out;
}

    else if(r.err) rows.push(`<tr><td>${b}</td><td>${TF[tf].l}</td><td colspan="6" style="color:var(--down);text-align:left">找不到 ${b}USDT 合約</td></tr>`);
    else if(!r.divs.length) rows.push(`<tr><td>${nm}</td><td>${TF[tf].l}</td><td style="color:var(--mute)">無背離</td><td>–</td><td>–</td><td>–</td><td>–</td><td class="price">${fmtPrice(r.price)}</td></tr>`);
    else for(const d of r.divs) rows.push(`<tr><td>${nm}</td><td>${TF[tf].l}</td><td class="chg ${d.top?'d':'u'}">${d.top?"頂背離":"底背離"}</td>${mark(d.macd, d.top)}${mark(d.vol, d.top)}${mark(d.rsi, d.top)}<td>${fmtT(d.t, tf)}</td><td class="price">${fmtPrice(r.price)}</td></tr>`);
  }
  $("z5B").innerHTML = rows.length ? `<table><thead><tr><th>合約</th><th>週期</th><th>方向</th><th>MACD</th><th>成交量</th><th>RSI</th><th>K線時間</th><th>現價</th></tr></thead><tbody>${rows.join("")}</tbody></table>` : "";
}

/* ---------- 新上榜 ---------- */
function track(key, list){
  const cur = new Set(list.map(r => r.s)), now = Date.now();
  if(!seen[key]){ seen[key] = {}; cur.forEach(s => seen[key][s] = 0); return; }
  cur.forEach(s => { if(!(s in seen[key])) seen[key][s] = now; });
  Object.keys(seen[key]).forEach(s => { if(!cur.has(s)) delete seen[key][s]; });
}
const isNew = (key, s) => { const t = seen[key] && seen[key][s]; return t && Date.now() - t < 600000; };

/* ---------- 畫面 ---------- */
function table(list, sel, cls, key){
  if(!list.length) return `<div class="empty">目前沒有符合條件的合約</div>`;
  const pin = new Set(S.pins);
  const body = list.map((r, n) => {
    const c = sel(r), f = r.fund, hot = Math.abs(f) >= 0.0005;
    const color = cls || (c.pct > 0 ? "u" : "d");
    return `<tr><td>${n+1}</td>
      <td><a href="${link(r.s)}" target="_blank" rel="noopener">${r.s.replace("USDT","")}<span style="color:var(--mute);font-weight:400">/USDT</span></a>${isNew(key, r.s) ? '<span class="new">新</span>' : ''}</td>
      <td class="chg ${color}">${sgn(c.pct)}</td><td>${fmtTime(c.t)}</td><td class="price">${fmtPrice(r.price)}</td>
      <td class="${hot?'w':''}" title="資金費率（每期）">${f==null?"–":(f*100).toFixed(4)+"%"}</td>
      <td>${fmtVol(r.vol12)}</td>
      <td class="act"><button data-act="pin" data-s="${r.s}" class="${pin.has(r.s)?'on':''}" title="自選" aria-label="自選">${pin.has(r.s)?'★':'☆'}</button><button data-act="hide" data-s="${r.s}" title="隱藏" aria-label="隱藏">✕</button></td></tr>`;
  }).join("");
  return `<table><thead><tr><th></th><th>合約</th><th>${IVL[S.iv]}漲跌</th><th>時間</th><th>現價</th><th>資金費率</th><th>12h 成交額</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
}

function render(){
  const hid = new Set(S.hidden), pin = new Set(S.pins);
  const f = rows.filter(r => !hid.has(r.s) && r.vol12 >= S.minVol);
  const upSel = S.mode === "max" ? r => r.up : r => r.last;
  const dnSel = S.mode === "max" ? r => r.dn : r => r.last;
  const g = f.filter(r => upSel(r).pct > 0).sort((a,b) => upSel(b).pct - upSel(a).pct).slice(0,10);
  const l = f.filter(r => dnSel(r).pct < 0).sort((a,b) => dnSel(a).pct - dnSel(a).pct).slice(0,10);
  const p = rows.filter(r => pin.has(r.s)).sort((a,b) => Math.abs(b.last.pct) - Math.abs(a.last.pct));
  track("g", g); track("l", l);

  $("gT").textContent = `漲幅榜（${IVL[S.iv]}K）`;
  $("lT").textContent = `跌幅榜（${IVL[S.iv]}K）`;
  $("gainers").innerHTML = table(g, upSel, "u", "g");
  $("losers").innerHTML = table(l, dnSel, "d", "l");
  $("pinPanel").hidden = !S.pins.length;
  $("pins").innerHTML = S.pins.length ? table(p, r => r.last, null, "p") : "";

  $("hidBtn").textContent = `已隱藏 ${S.hidden.length} 個`;
  $("hiddenBox").innerHTML = S.hidden.map(s => `<button data-act="restore" data-s="${s}" title="點一下恢復顯示">${s.replace("USDT","")} ↺</button>`).join("");
  if(!S.hidden.length) $("hiddenBox").hidden = true;

  renderExt();
  renderZone1();
  renderVol();
  renderDiv();
  renderTrack();
}

/* ---------- 互動 ---------- */
function group(id, key, conv, onChange){
  const el = $(id);
  const sync = () => el.querySelectorAll("button").forEach(b => b.classList.toggle("on", conv(b.dataset.v) === S[key]));
  sync();
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    S[key] = conv(b.dataset.v); save(); sync(); seen = {}; onChange();
  });
}
group("vol", "minVol", Number, render);
group("mode", "mode", String, render);
group("iv", "iv", String, () => { rows = []; render(); load(); });

$("thr").value = S.thr;
$("thr").addEventListener("change", e => { S.thr = Math.max(0.5, +e.target.value || 5); e.target.value = S.thr; save(); pArmed = false; palerted.clear(); load(); });
$("loPct").value = S.lowPct; $("hiPct").value = S.highPct;
$("loPct").addEventListener("change", e => { S.lowPct = Math.max(0.1, +e.target.value || 10); e.target.value = S.lowPct; save(); render(); });
$("hiPct").addEventListener("change", e => { S.highPct = Math.max(0.1, +e.target.value || 10); e.target.value = S.highPct; save(); render(); });
$("capMin").value = S.capMin; $("capMax").value = S.capMax;
$("capMin").addEventListener("change", e => { S.capMin = Math.max(0, +e.target.value || 0); e.target.value = S.capMin; save(); render(); });
$("capMax").addEventListener("change", e => { S.capMax = Math.max(0, +e.target.value || 0); e.target.value = S.capMax; save(); render(); });
$("evol").value = S.evol;
$("evol").addEventListener("change", e => { S.evol = Math.max(0, +e.target.value || 0); e.target.value = S.evol; save(); render(); });
$("days").value = S.days;
$("days").addEventListener("change", e => { S.days = Math.min(365, Math.max(1, Math.round(+e.target.value || 30))); e.target.value = S.days; save(); render(); });
$("vthr").value = S.vthr;
$("vthr").addEventListener("change", e => { S.vthr = Math.max(10, +e.target.value || 1000); e.target.value = S.vthr; save(); vArmed = false; valerted.clear(); forceVol = true; load(); });
$("mcap").value = S.mcap;
$("mcap").addEventListener("change", e => { S.mcap = Math.max(0, +e.target.value || 0); e.target.value = S.mcap; save(); vArmed = false; valerted.clear(); forceVol = true; load(); });
$("vhide").value = S.vhide;
$("vhide").addEventListener("change", e => { S.vhide = e.target.value; save(); vArmed = false; valerted.clear(); forceVol = true; load(); });
group("vtf", "vtf", String, () => { vArmed = false; valerted.clear(); volHits = []; forceVol = true; renderVol(); load(); });
$("vnotify").checked = S.vnotify;
$("vnotify").addEventListener("change", e => {
  S.vnotify = e.target.checked; save();
  if(S.vnotify){
    try{ ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); }catch(_){}
    if("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    vArmed = false; valerted.clear(); load();
  }
});
const isDark = () => S.theme === "dark" || (S.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme(){
  if(S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = S.theme;
  $("theme").textContent = isDark() ? "☾ 夜間模式" : "☀ 日間模式";
}
$("theme").addEventListener("click", () => { S.theme = isDark() ? "light" : "dark"; save(); applyTheme(); });
applyTheme();
$("notify").checked = S.notify;
$("notify").addEventListener("change", e => {
  S.notify = e.target.checked; save();
  if(S.notify){ askNotify(); pArmed = false; palerted.clear(); load(); }
});
function askNotify(){
  try{ ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); }catch(_){}
  if("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}
$("avol").value = S.avol;
$("avol").addEventListener("change", e => {
  S.avol = Math.max(0, +e.target.value || 0); e.target.value = S.avol; save();
  pArmed = vArmed = false; palerted.clear(); valerted.clear(); dalerted.clear(); forceVol = true;
  for(const k in divCache) delete divCache[k];
  load();
});
$("cryptoOnly").checked = S.cryptoOnly;
$("cryptoOnly").addEventListener("change", e => {
  S.cryptoOnly = e.target.checked; save(); vArmed = false; valerted.clear(); forceVol = true;
  load();
});
$("dnotify").checked = S.dnotify;
$("dnotify").addEventListener("change", e => {
  S.dnotify = e.target.checked; save();
  if(S.dnotify){
    askNotify();
    const c = divCache[S.dtf];
    if(c) c.hits.filter(h => h.macd && h.vol).forEach(h => dalerted.add(divKey(h)));
  }
});
group("dtf", "dtf", String, () => {
  // 切換背離提醒週期時，重置該週期的快取以利即時更新
  if(divCache[S.dtf]) divCache[S.dtf].next = 0;
  renderDiv(); ensureDiv(); 
});
group("otf", "otf", String, () => { 
  // 切換背離總覽週期時，重置該週期的快取以利即時更新
  if(divCache[S.otf]) divCache[S.otf].next = 0;
  renderDiv(); ensureDiv(); 
});
$("ttf").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const v = b.dataset.v;
  S.ttf = S.ttf.includes(v) ? S.ttf.filter(x => x !== v) : [...S.ttf, v];
  if(!S.ttf.length) S.ttf = [v];
  save(); renderTrack(); scanTrack().catch(() => {});
});
$("tnotify").checked = S.tnotify;
$("tnotify").addEventListener("change", e => {
  S.tnotify = e.target.checked; save();
  if(S.tnotify){
    askNotify();
    for(const tf in trk) for(const b of S.track){ const r = trk[tf].res[b]; if(r && !r.err) r.divs.forEach(d => talerted.add("t" + tf + b + d.top + d.t + kindsOf(d))); }
  }
});
function addTrack(){
  const inp = $("tadd");
  const adds = inp.value.split(/[,，\s]+/).map(x => x.toUpperCase().replace(/USDT$/, "").replace(/[^A-Z0-9]/g, "")).filter(Boolean);
  inp.value = "";
  if(!adds.length) return;
  S.track = [...new Set([...S.track, ...adds])]; save();
  for(const tf in trk) trk[tf].next = 0;
  renderTrack(); scanTrack().catch(() => {});
}
$("tbtn").addEventListener("click", addTrack);
$("tadd").addEventListener("keydown", e => { if(e.key === "Enter") addTrack(); });
$("hidBtn").addEventListener("click", () => { if(S.hidden.length) $("hiddenBox").hidden = !$("hiddenBox").hidden; });

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const s = b.dataset.s, a = b.dataset.act;
  if(a === "pin"){
    S.pins = S.pins.includes(s) ? S.pins.filter(x => x !== s) : [...S.pins, s];
  }else if(a === "hide"){
    S.hidden = [...new Set([...S.hidden, s])]; S.pins = S.pins.filter(x => x !== s);
  }else if(a === "restore"){
    S.hidden = S.hidden.filter(x => x !== s);
  }else if(a === "tdel"){
    S.track = S.track.filter(x => x !== s);
  }
  save(); render();
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
